[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  external_node_modules = ["express", "pg", "bcryptjs", "express-session", "connect-pg-simple", "xlsx", "serverless-http", "helmet", "express-rate-limit"]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
